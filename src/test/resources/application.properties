spring.datasource.url=jdbc:h2:mem:zeus_payment_agent;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
mybatis.configuration.map-underscore-to-camel-case=true
spring.sql.init.mode=never
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.chroma.autoconfigure.ChromaVectorStoreAutoConfiguration
spring.ai.openai.api-key=test
spring.ai.openai.embedding.api-key=test
spring.ai.openai.embedding.base-url=http://127.0.0.1
spring.ai.openai.embedding.options.model=test-embedding
spring.ai.openai.embedding.options.dimensions=1024
