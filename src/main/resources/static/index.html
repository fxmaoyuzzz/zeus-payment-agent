<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zeus Payment Agent</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>Zeus Payment Agent</h1>
          <p id="sessionLabel"></p>
        </div>
        <div class="topbar-actions">
          <input id="reportDateInput" type="date" value="2026-08-25" aria-label="日报日期">
          <button id="loadReportButton" type="button">日报</button>
          <button id="newSessionButton" type="button">新会话</button>
        </div>
      </header>

      <section id="reportPanel" class="report-panel" hidden>
        <div class="report-panel-header">
          <div>
            <h2>支付日报</h2>
            <p id="reportSummary"></p>
          </div>
        </div>
        <div class="chart-grid">
          <div class="chart-box">
            <h3>订单状态</h3>
            <canvas id="statusChart" width="320" height="180"></canvas>
          </div>
          <div class="chart-box">
            <h3>渠道分布</h3>
            <canvas id="channelChart" width="320" height="180"></canvas>
          </div>
          <div class="chart-box">
            <h3>失败原因 Top</h3>
            <canvas id="failureChart" width="320" height="180"></canvas>
          </div>
        </div>
      </section>

      <section id="messages" class="messages" aria-live="polite"></section>

      <form id="chatForm" class="composer">
        <textarea
          id="messageInput"
          name="message"
          rows="2"
          placeholder="输入订单问题，例如：帮我查一下订单 P202608250001"
          required></textarea>
        <button id="sendButton" type="submit">发送</button>
      </form>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
