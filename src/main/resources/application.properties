spring.application.name=zeus-payment-agent
spring.config.import=optional:file:.env[.properties],optional:file:application-local.properties

spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.configuration.map-underscore-to-camel-case=true

spring.flyway.enabled=false

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=${REDIS_DATABASE}

spring.ai.openai.api-key=${DEEPSEEK_API_KEY}
spring.ai.openai.base-url=https://api.deepseek.com
spring.ai.openai.chat.api-key=${DEEPSEEK_API_KEY}
spring.ai.openai.chat.base-url=https://api.deepseek.com
spring.ai.openai.chat.options.model=deepseek-v4-flash
spring.ai.openai.chat.options.temperature=0.2

spring.ai.openai.embedding.api-key=${EMBEDDING_API_KEY}
spring.ai.openai.embedding.base-url=${EMBEDDING_BASE_URL}
spring.ai.openai.embedding.options.model=${EMBEDDING_MODEL}
spring.ai.openai.embedding.options.dimensions=${EMBEDDING_DIMENSIONS}

spring.ai.vectorstore.chroma.client.host=${CHROMA_HOST}
spring.ai.vectorstore.chroma.client.port=${CHROMA_PORT}
spring.ai.vectorstore.chroma.tenant-name=${CHROMA_TENANT_NAME}
spring.ai.vectorstore.chroma.database-name=${CHROMA_DATABASE_NAME}
spring.ai.vectorstore.chroma.collection-name=${CHROMA_COLLECTION_NAME}
spring.ai.vectorstore.chroma.initialize-schema=true

management.otlp.metrics.export.enabled=false

zeus.report.daily-cron=0 5 0 * * *
zeus.report.zone=Asia/Shanghai
